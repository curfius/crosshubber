<div class="flex h-full bg-[var(--portal-bg-base)] text-[var(--portal-text-secondary)]">
  <!-- Left sidebar with section tree -->
  <div class="w-64 shrink-0 border-r border-[var(--portal-border-default)] pt-4 pb-4 pr-3 pl-3 overflow-y-auto">
    <h2 class="mb-4 text-xs font-semibold uppercase tracking-widest text-[var(--portal-text-muted)]">{{ i18n.t('settings.title') }}</h2>
    <app-ds-tree
      [nodes]="dsNodes()"
      [selectedId]="selectedEntryId()"
      (nodeSelected)="onTreeNodeSelected($event)" />
    @if (!isAdmin()) {
    <div class="mt-4 rounded-lg border border-[var(--portal-status-warning-subtle)] bg-[var(--portal-status-warning-bg)] p-3">
      <p class="text-xs text-[var(--portal-status-warning)]">{{ i18n.t('settings.readonly') }}</p>
      <p class="mt-1 text-[10px] text-[var(--portal-status-warning)] opacity-70">{{ i18n.t('settings.readonlyHint') }}</p>
    </div>
    }
  </div>

  <!-- Main content area: dynamic outlet -->
  <div class="flex-1 overflow-y-auto">
    @if (activeEntry(); as ep) {
      <div class="p-6">
        <app-outlet [entryPoint]="ep" [user]="user()" />
      </div>
    } @else {
      <div class="flex h-full items-center justify-center text-sm text-[var(--portal-text-muted)]">
        {{ i18n.t('settings.selectSection') }}
      </div>
    }
  </div>
</div>
