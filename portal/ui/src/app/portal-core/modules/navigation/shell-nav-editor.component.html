@if (saveError()) {
<div class="mb-4 rounded-lg border border-[var(--portal-status-danger)] bg-[var(--portal-bg-surface)] px-3 py-2 text-xs text-[var(--portal-status-danger)]">
  {{ i18n.t('navigation.shell.saveFailed') }}: {{ saveError() }}
</div>
}

@if (loading()) {
<p class="py-8 text-center text-xs text-[var(--portal-text-disabled)]">{{ i18n.t('common.loading') }}</p>
} @else if (loadError()) {
<p class="py-8 text-center text-xs text-[var(--portal-status-danger)]">{{ i18n.t('common.error') }}</p>
} @else {
<div class="ds-card p-4">
  <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
    <h3 class="ds-heading-3 text-sm">{{ treeTitle() }}</h3>
    <div class="flex items-center gap-2">
      @if (saveSuccess() && !dirty()) {
      <span class="text-xs text-[var(--portal-status-success)]">{{ i18n.t('common.saved') }}</span>
      }
      <button type="button" class="ds-btn ds-btn-secondary ds-btn-sm" [disabled]="!dirty() || saving()" (click)="discard()">
        {{ i18n.t('common.cancel') }}
      </button>
      <button type="button" class="ds-btn ds-btn-primary ds-btn-sm" [disabled]="!dirty() || saving()" (click)="save()">
        {{ saving() ? i18n.t('common.loading') : i18n.t('common.save') }}
      </button>
    </div>
  </div>
  <app-dnd-tree
    [nodes]="dndNodes()"
    [maxDepth]="3"
    [rootLabel]="treeTitle()"
    [showVisibility]="true"
    deleteMode="folders-only"
    [addFolderLabel]="i18n.t('navigation.shell.newSection')"
    (nodesChange)="onTreeChange($event)" />
</div>
}
