<div class="markdown-editor">
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-group">
      <button type="button" (click)="bold()" [title]="i18n.t('md.bold')" class="toolbar-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="size-3.5"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
      </button>
      <button type="button" (click)="italic()" [title]="i18n.t('md.italic')" class="toolbar-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="size-3.5"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
      </button>
      <button type="button" (click)="code()" [title]="i18n.t('md.code')" class="toolbar-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="size-3.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      </button>
      <button type="button" (click)="link()" [title]="i18n.t('md.link')" class="toolbar-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="size-3.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <!-- Heading dropdown -->
      <div class="heading-wrapper">
        <button type="button" (click)="toggleHeadingMenu()" [class.active]="!!activeHeading()" class="toolbar-btn heading-btn">
          <span class="text-[10px] font-bold">{{ activeHeading() ? activeHeading()!.replace('h','H') : 'H' }}</span>
          <svg class="size-2.5 ml-0.5" viewBox="0 0 12 12" fill="currentColor"><path d="M2 4l4 4 4-4"/></svg>
        </button>
        @if (headingMenuOpen) {
        <div class="heading-dropdown">
          <button type="button" (click)="heading(1)" [class.active]="activeHeading() === 'h1'" class="heading-dropdown-item">
            <span class="text-sm font-bold">{{ i18n.t('md.heading-1') }}</span>
            <span class="text-[10px] text-[var(--portal-text-muted)]"># Big</span>
          </button>
          <button type="button" (click)="heading(2)" [class.active]="activeHeading() === 'h2'" class="heading-dropdown-item">
            <span class="text-sm font-semibold">{{ i18n.t('md.heading-2') }}</span>
            <span class="text-[10px] text-[var(--portal-text-muted)]">## Medium</span>
          </button>
          <button type="button" (click)="heading(3)" [class.active]="activeHeading() === 'h3'" class="heading-dropdown-item">
            <span class="text-xs font-semibold">{{ i18n.t('md.heading-3') }}</span>
            <span class="text-[10px] text-[var(--portal-text-muted)]">### Small</span>
          </button>
          <button type="button" (click)="heading(4)" [class.active]="activeHeading() === 'h4'" class="heading-dropdown-item">
            <span class="text-xs font-medium">{{ i18n.t('md.heading-4') }}</span>
            <span class="text-[10px] text-[var(--portal-text-muted)]">#### Normal</span>
          </button>
          <button type="button" (click)="heading(5)" [class.active]="activeHeading() === 'h5'" class="heading-dropdown-item">
            <span class="text-xs font-medium">{{ i18n.t('md.heading-5') }}</span>
            <span class="text-[10px] text-[var(--portal-text-muted)]">##### Fine</span>
          </button>
          <button type="button" (click)="heading(6)" [class.active]="activeHeading() === 'h6'" class="heading-dropdown-item">
            <span class="text-xs font-medium">{{ i18n.t('md.heading-6') }}</span>
            <span class="text-[10px] text-[var(--portal-text-muted)]">###### Tiny</span>
          </button>
          @if (activeHeading()) {
          <button type="button" (click)="removeHeading()" class="heading-dropdown-item">
            <span class="text-xs text-[var(--portal-text-tertiary)]">{{ i18n.t('md.remove-heading') }}</span>
          </button>
          }
        </div>
        }
      </div>
      <button type="button" (click)="bullets()" [title]="i18n.t('md.bullet-list')" class="toolbar-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="size-3.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" (click)="numbers()" [title]="i18n.t('md.numbered-list')" class="toolbar-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="size-3.5"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="2" y="8" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">1</text><text x="2" y="14" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">2</text><text x="2" y="20" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">3</text></svg>
      </button>
      <button type="button" (click)="quote()" [title]="i18n.t('md.blockquote')" class="toolbar-btn">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" class="size-3.5"><path d="M4.583 17.321C3.553 16.227 3 15 3 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311C9.591 11.991 11 13.355 11 15c0 3-2.13 4.5-4.25 4.5-1 0-2.042-.44-2.167-2.179zM14.583 17.321C13.553 16.227 13 15 13 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311C19.591 11.991 21 13.355 21 15c0 3-2.13 4.5-4.25 4.5-1 0-2.042-.44-2.167-2.179z"/></svg>
      </button>
      <button type="button" (click)="insertTable()" [title]="i18n.t('md.table')" class="toolbar-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
      </button>
      <button type="button" (click)="hr()" [title]="i18n.t('md.horizontal-rule')" class="toolbar-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="size-3.5"><line x1="2" y1="12" x2="22" y2="12"/></svg>
      </button>
    </div>
    <div class="toolbar-spacer"></div>
    <button type="button" (click)="togglePreview()" [class.active]="showPreview" class="toolbar-btn preview-toggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-3.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>{{ showPreview ? i18n.t('md.hide-preview') : i18n.t('md.show-preview') }}</span>
    </button>
  </div>

  <!-- Editable markdown source -->
  <textarea #textarea
    class="editor"
    [value]="content"
    (input)="onInput()"
    (keydown)="onKeydown($event)"
    (keyup)="onSelect()"
    (click)="onSelect()"
    (blur)="closeHeadingMenu()"
    (scroll)="onTextareaScroll()"
    [placeholder]="placeholder"
    [style.min-height]="minHeight"></textarea>

  <!-- Read-only live preview -->
  @if (showPreview) {
    <div class="preview-divider"></div>
    <div #preview
      class="preview markdown-preview"
      [innerHTML]="renderedContent"
      (scroll)="onPreviewScroll()"></div>
  }
</div>
